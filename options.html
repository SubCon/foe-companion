<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FoE Companion — Settings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 32px;
            min-height: 100vh;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 28px;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
        }

        .feature-list {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 32px;
            border: 1px solid #0f3460;
        }

        .feature {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid #0f3460;
        }

        .feature:last-child {
            border-bottom: none;
        }

        .feature-info {
            flex: 1;
            margin-right: 24px;
        }

        .feature-label {
            font-weight: 500;
            color: #fff;
            margin-bottom: 3px;
        }

        .feature-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: #333;
            border-radius: 22px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-track::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle input:checked + .toggle-track {
            background: #e8a020;
        }

        .toggle input:checked + .toggle-track::after {
            transform: translateX(18px);
        }

        #saved-msg {
            font-size: 12px;
            color: #e8a020;
            opacity: 0;
            transition: opacity 0.3s;
            margin-left: 12px;
        }

        #saved-msg.visible {
            opacity: 1;
        }

        #dev-section {
            display: none;
            margin-top: 32px;
        }

        #dev-section .section-title {
            color: #e8a020;
        }

        #dev-section .feature-list {
            border-color: #e8a020;
        }

        #dev-section .feature {
            border-bottom-color: #2a1a00;
        }
    </style>
</head>
<body>
    <h1>FoE Companion</h1>

    <div class="section-title">Features</div>
    <div class="feature-list" id="feature-list"></div>

    <span id="saved-msg">Saved</span>

    <div id="dev-section">
        <div class="section-title">Developer</div>
        <div class="feature-list" id="dev-feature-list"></div>
    </div>

    <script src="options.js"></script>
</body>
</html>
